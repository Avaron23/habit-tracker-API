name: habit-tracker-tests
services:
  test_db:
    image: postgres:17
    container_name: habit-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: habit_test_db
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d habit_test_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s